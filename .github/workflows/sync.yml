name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间 8:00 自动触发
  workflow_dispatch:   # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    
    # ================== 🔑 升级权限：允许同步上游的脚本变动 ==================
    permissions:
      contents: write
      workflows: write
    # =====================================================================

    steps:
      - name: Sync Upstream Using GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync ${{ github.repository }} -b main

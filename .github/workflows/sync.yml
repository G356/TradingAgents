name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间 8:00 自动触发
  workflow_dispatch:   # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    
    # 保持局部写权限，确保其他脚本安全
    permissions:
      contents: write

    steps:
      - name: Sync Upstream Using GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 抛弃 checkout 和任何插件，直接一行官方原生命令秒级同步
        run: |
          gh repo sync ${{ github.repository }} -b main

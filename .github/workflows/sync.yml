name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      # 1. 必须使用 checkout 拉取你自己的代码库
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0 # 拉取完整历史

      # 2. 用原生的 Git 命令完成纯净、无拦截的强制同步
      - name: Hard Sync with Upstream
        run: |
          # 配置本地 git 用户信息
          git config --global user.name "mark"
          git config --global user.email "wxb99356@gmail.com"
          
          # 动态获取你当前 Fork 的上游原作者仓库地址
          UPSTREAM_URL=$(gh repo view ${{ github.repository }} --json parent --jq '.parent.url')
          echo "Upstream URL discovered: $UPSTREAM_URL"
          
          # 添加上游远程源并拉取
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream main
          
          # 强行用上游的 main 分支覆盖你自己的本地分支
          git checkout main
          git reset --hard upstream/main
          
          # 强行推送到你自己的仓库（Actions 自身带有的权限已经足够强推）
          git push origin main --force

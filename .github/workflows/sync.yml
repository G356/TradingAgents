name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Upstream Using GitHub CLI
        env:
          # 使用默认的临时 token 即可，不需要配置额外的秘密变量
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 【核心黑科技】在同步前，静默给官方 CLI 强行注入当前 job 的最高管理授权
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
          
          # 执行同步
          gh repo sync ${{ github.repository }} -b main
